name: Deploy to GitHub Pages

# This is a zero-build static site — there is nothing to compile. This
# workflow stages only the site files (skipping README/scripts/dev config)
# and publishes them to GitHub Pages whenever you push to main.
#
# You do NOT need this workflow at all if you'd rather use the simpler
# "Settings → Pages → Deploy from a branch" option instead (see README) —
# both approaches serve the exact same files, this one just keeps the
# published site tidy by excluding repo-only files like README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files only
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='scripts' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            --exclude='_site' \
            ./ _site/

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
